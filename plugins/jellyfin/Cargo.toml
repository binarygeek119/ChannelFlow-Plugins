[package]
name = "channelflow-plugin-jellyfin"
version = "2.0.5"
edition = "2021"
license = "MIT"
description = "Jellyfin Media Source — sync movies, TV, and music from a Jellyfin server"

# `rlib` keeps the crate usable as a git dependency of the base (compiled in);
# `cdylib` produces the per-platform shared library the install flow ships.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
channelflow-plugin-api = { git = "https://github.com/binarygeek119/ChannelFlow", branch = "2.0.0" }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "charset", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "time"] }
tracing = "0.1"
url = "2"
[features]
# Builds the exported ABI entrypoint into the cdylib; the compiled-in base
# leaves it off so plugins sharing a symbol name do not collide.
abi = []

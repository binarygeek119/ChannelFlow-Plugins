<div class="panel">
  <div class="panel-head">
    <h2>Presets</h2>
    <span class="count" id="presets-count"></span>
  </div>
  <p class="hint" id="presets-note"></p>
  <div class="presets-modes presets-dial-switch">
    <span class="field-label">Dial numbers</span>
    <span class="switch-with-labels">
      <span class="switch-label">Retro</span>
      <label class="switch" title="Whole-number dial positions (119) ⇄ modern subchannels (119.1)">
        <input type="checkbox" id="presets-dial-switch">
        <span class="track"></span>
        <span class="thumb"></span>
      </label>
      <span class="switch-label">Modern</span>
    </span>
  </div>
  <div class="presets-modes" id="weatherstar-modes" hidden></div>
  <div class="ms-form-actions">
    <button type="button" class="primary" id="presets-apply">Create missing channels</button>
    <span class="field-note" id="presets-result"></span>
  </div>
  <div id="presets-list"></div>
</div>

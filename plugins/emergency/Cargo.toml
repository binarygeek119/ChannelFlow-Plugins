[package]
name = "channelflow-plugin-emergency"
version = "2.0.1"
edition = "2021"
license = "MIT"
description = "Emergency Broadcast System — how weather alerts overlay programming"

# `rlib` keeps the crate usable as a git dependency of the base (compiled in);
# `cdylib` produces the per-platform shared library the install flow ships.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
channelflow-plugin-api = { git = "https://github.com/binarygeek119/ChannelFlow", branch = "2.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "charset", "json"] }

[features]
# Present so the release build can pass --features abi uniformly; this plugin
# declares no exported ABI symbols yet.
abi = []
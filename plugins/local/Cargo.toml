[package]
name = "channelflow-plugin-local"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "Local — a media source for files on this machine, no media server (NFO metadata + poster.jpg/png)"

# `rlib` keeps the crate usable as a git dependency of the base (compiled in);
# `cdylib` produces the per-platform shared library the install flow ships.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
channelflow-plugin-api = { git = "https://github.com/binarygeek119/ChannelFlow", branch = "2.0.0" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"

[features]
# Present so the release build can pass --features abi uniformly; this plugin
# declares no exported ABI symbols yet.
abi = []
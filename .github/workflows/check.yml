name: Check plugins

# Every push and pull request builds the whole workspace and runs the tests, so
# a plugin that no longer compiles is caught before anyone tags a release.
# Tagged releases are handled by release-plugin.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build every plugin
        run: cargo build --workspace --release

      - name: Test every plugin
        run: cargo test --workspace

      - name: Validate manifest.json
        run: |
          python3 - <<'PY'
          import json, pathlib
          manifest = pathlib.Path('manifest.json')
          if not manifest.exists():
              print('no manifest.json; skip')
              raise SystemExit(0)
          plugins = json.loads(manifest.read_text())
          ids = [e['id'] for e in plugins]
          assert len(ids) == len(set(ids)), 'duplicate plugin ids in manifest.json'
          for entry in plugins:
              assert entry.get('imageUrl', '').startswith('https://'), f"{entry['id']} needs an https imageUrl"
              assert pathlib.Path('banners', f"{entry['id']}.png").exists(), f"{entry['id']} banner missing in banners/"
              assert entry['versions'], f"{entry['id']} has no versions"
              for version in entry['versions']:
                  assert version['artifacts'], f"{entry['id']} {version['version']} has no artifacts"
                  for rid, artifact in version['artifacts'].items():
                      assert artifact['url'].startswith('https://'), f"bad url for {entry['id']}"
                      assert artifact['checksum'].startswith('sha256:'), f"bad checksum for {entry['id']}"
                      assert isinstance(artifact['size'], int), f"bad size for {entry['id']}"
          print(f'manifest.json OK: {len(plugins)} plugin(s)')
          PY
